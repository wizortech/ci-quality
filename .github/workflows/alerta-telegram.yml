name: Alerta no Telegram

# Avisa no Telegram da plataforma que um workflow falhou. Feito para o noturno
# (ADR 0006 do deploy-workflows): o app chama este workflow num job com
# `needs: [<jobs do noturno>]` e `if: failure()`.
#
# O token do bot e o chat vêm do Doppler (TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID no
# config platform/ci), lidos com o token read-only que fica no ambiente dos runners
# self-hosted da org (DOPPLER_TOKEN no .env do runner). Assim o repositório não precisa
# de secret nenhum (no GitHub Free, secret de organização não chega a repositório privado).
# O secret DOPPLER_TOKEN ainda é aceito, opcional, só para a transição.

on:
  workflow_call:
    inputs:
      runner:
        description: "Label do runner (padrão: self-hosted, qualquer um dos 5 runners ARM64 da org; ADR 0006 do deploy-workflows)"
        type: string
        default: self-hosted
    secrets:
      DOPPLER_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  alerta:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Mandar a mensagem
        env:
          SECRET_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          token="${SECRET_TOKEN:-${DOPPLER_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "::error::DOPPLER_TOKEN ausente no ambiente do runner (token read-only de platform/ci)"
            exit 1
          fi
          # os tokens vão em arquivos de config do curl, não na linha de comando (ps)
          dcfg="$RUNNER_TEMP/doppler.curl"
          cfg="$RUNNER_TEMP/telegram.curl"
          trap 'rm -f "$dcfg" "$cfg"' EXIT
          printf 'user = "%s:"\n' "$token" > "$dcfg"
          json=$(curl -sS --fail-with-body -K "$dcfg" \
            "https://api.doppler.com/v3/configs/config/secrets/download?format=json")
          BOT_TOKEN=$(jq -r '.TELEGRAM_BOT_TOKEN // empty' <<<"$json")
          CHAT_ID=$(jq -r '.TELEGRAM_CHAT_ID // empty' <<<"$json")
          unset json
          [ -n "$BOT_TOKEN" ] && echo "::add-mask::$BOT_TOKEN"
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID ausente no Doppler platform/ci"
            exit 1
          fi
          texto=$(printf '🔴 %s: "%s" falhou\n%s' "$REPO" "$WORKFLOW" "$RUN_URL")
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$BOT_TOKEN" > "$cfg"
          curl -sS --fail-with-body -K "$cfg" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$texto" \
            --data "disable_web_page_preview=true" > /dev/null
