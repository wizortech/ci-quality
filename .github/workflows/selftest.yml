name: Autoteste

# Roda os workflows deste repositório contra ele mesmo, nos runners padrão
# (arm64-sp-sem-kubeconfig), antes de mover a tag v1.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  security:
    uses: ./.github/workflows/security.yml

  # Dois jobs ao mesmo tempo para cair nos dois runners do label: gitleaks, Semgrep
  # e Trivy rodam em container, e o e2e instala o Chromium com sudo.
  runner:
    strategy:
      matrix:
        n: [1, 2]
    runs-on: arm64-sp-sem-kubeconfig
    timeout-minutes: 5
    steps:
      - name: Pré-requisitos do runner
        run: |
          echo "runner: $RUNNER_NAME"
          docker version --format 'docker {{.Server.Version}}'
          sudo -n true && echo "sudo sem senha: ok"
          df -h "$RUNNER_WORKSPACE" | tail -1
