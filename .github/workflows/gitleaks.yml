name: gitleaks

# Só o gitleaks, para o deploy (ADR 0006 do deploy-workflows): Semgrep e Trivy
# rodam no PR e no noturno, via security.yml. O job é o mesmo do security.yml.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      runner:
        description: "Label do runner (padrão: arm64-sp-sem-kubeconfig, os runners sem kubeconfig; ADR 0006 do deploy-workflows)"
        type: string
        default: arm64-sp-sem-kubeconfig

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: gitleaks (diretório, sem histórico)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir "/repo/$WORKING_DIR" --redact --no-banner --exit-code 1
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
      - name: Resumo (gitleaks sem achados)
        if: success()
        run: |
          echo "gitleaks: nenhum secret detectado" >> "$GITHUB_STEP_SUMMARY"
