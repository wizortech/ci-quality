name: Segurança

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      enforce:
        description: "Se false, Semgrep e Trivy só reportam (gitleaks sempre bloqueia)"
        type: boolean
        default: true
      block-critical:
        description: "Bloqueia CVE/config/segredo CRITICAL do Trivy mesmo com enforce=false (e falha se o Trivy não conseguir rodar)"
        type: boolean
        default: false
      runner:
        description: "Label do runner (padrão: self-hosted, qualquer um dos 5 runners ARM64 da org; ADR 0006 do deploy-workflows)"
        type: string
        default: self-hosted

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: gitleaks (diretório, sem histórico)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir "/repo/$WORKING_DIR" --redact --no-banner --exit-code 1
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
      - name: Resumo (gitleaks sem achados)
        if: success()
        run: |
          echo "gitleaks: nenhum secret detectado" >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Semgrep CE
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/src" -w "/src/$WORKING_DIR" \
            semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --config p/default --config p/secrets --error --metrics=off . | tee "$RUNNER_TEMP/semgrep.txt"
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
      - name: Reportar Semgrep
        if: steps.scan.outcome == 'failure'
        run: |
          {
            echo "## Semgrep encontrou problemas"
            echo '```'
            tail -n 200 "$RUNNER_TEMP/semgrep.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::Semgrep detectou problemas (enforce=true)"
          else
            echo "::warning::Semgrep detectou problemas (modo relatório apenas)"
          fi
        env:
          ENFORCE: ${{ inputs.enforce }}
      - name: Bloquear se enforce
        if: steps.scan.outcome == 'failure' && inputs.enforce
        run: exit 1

  trivy:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Trivy fs (dependências, configs, segredos)
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          # cache no RUNNER_TEMP, com o usuário do runner (arquivo de root ali trava a limpeza)
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              fs --cache-dir /cache --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress \
              "$@" "/src/$WORKING_DIR"
          }
          trivy 2>&1 | tee "$RUNNER_TEMP/trivy.txt" && exit 0
          # Repo Java: o Maven Central às vezes responde 429 e o Trivy morre sem relatório (e o
          # job ficava verde com enforce=false). Repete sem rede para o Maven: as dependências
          # Java saem só do que está declarado no pom, o resto do scan é igual.
          grep -q '429 Too Many Requests' "$RUNNER_TEMP/trivy.txt" || exit 1
          echo "::warning::Maven Central respondeu 429; Trivy repetido com --offline-scan"
          echo "extra=--offline-scan" >> "$GITHUB_OUTPUT"
          trivy --offline-scan 2>&1 | tee "$RUNNER_TEMP/trivy.txt"
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
      - name: Reportar Trivy
        if: steps.scan.outcome == 'failure'
        run: |
          {
            echo "## Trivy encontrou problemas"
            echo '```'
            tail -n 200 "$RUNNER_TEMP/trivy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::Trivy detectou problemas (enforce=true)"
          else
            echo "::warning::Trivy detectou problemas (modo relatório apenas)"
          fi
        env:
          ENFORCE: ${{ inputs.enforce }}
      - name: Bloquear se enforce
        if: steps.scan.outcome == 'failure' && inputs.enforce
        run: exit 1
      # block-critical: segunda passada só com CRITICAL, sobre o banco já baixado. Bloqueia
      # também quando o Trivy não roda (ex.: 429 do Maven), para não virar verde sem scan.
      - name: Bloquear CRITICAL
        if: inputs.block-critical
        run: |
          set -o pipefail
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            fs --cache-dir /cache --skip-db-update --skip-java-db-update --scanners vuln,misconfig,secret --severity CRITICAL --exit-code 1 --no-progress \
            ${EXTRA:+"$EXTRA"} "/src/$WORKING_DIR" 2>&1 | tee "$RUNNER_TEMP/trivy-critical.txt"; then
            echo "Trivy: nenhum CRITICAL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Trivy: CRITICAL bloqueia (block-critical=true)"
            echo '```'
            tail -n 100 "$RUNNER_TEMP/trivy-critical.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Trivy encontrou CRITICAL ou não conseguiu rodar (block-critical=true)"
          exit 1
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
          EXTRA: ${{ steps.scan.outputs.extra }}
