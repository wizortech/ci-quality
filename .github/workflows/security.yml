name: Segurança

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      enforce:
        description: "Se false, Semgrep e Trivy só reportam (gitleaks sempre bloqueia)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: gitleaks (diretório, sem histórico)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir "/repo/${{ inputs.working-directory }}" --redact --no-banner --exit-code 1

  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.enforce }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Semgrep CE
        run: |
          docker run --rm -v "$PWD:/src" -w "/src/${{ inputs.working-directory }}" \
            semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --config p/default --config p/secrets --error --metrics=off .

  trivy:
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.enforce }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Trivy fs (dependências, configs, segredos)
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "/src/${{ inputs.working-directory }}"
